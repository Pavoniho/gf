<style>
  .ugc-slider,
  .ugc-slider *,
  .ugc-slider *::before,
  .ugc-slider *::after {
    box-sizing: border-box;
  }

  .ugc-slider {
    --ugc-accent: #8B1E2D;
    --ugc-gap: 12px;
    --ugc-per-view: 3;
    width: 100%;
    max-width: 1216px;
    margin: 0 auto;
    padding: 32px 20px;
    font-family: inherit;
  }

  .ugc-slider__title {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 600;
    line-height: 1.2;
    text-align: center;
    margin: 0 0 24px;
    color: var(--ugc-accent);
  }

  .ugc-slider__viewport {
    position: relative;
  }

  .ugc-slider__track {
    display: flex;
    gap: var(--ugc-gap);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .ugc-slider__track::-webkit-scrollbar {
    display: none;
  }

  .ugc-slider__slide {
    flex: 0 0 calc((100% - (var(--ugc-gap) * (var(--ugc-per-view) - 1))) / var(--ugc-per-view));
    scroll-snap-align: start;
  }

  .ugc-slider__card {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    cursor: pointer;
  }

  .ugc-slider__card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ugc-slider__play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.9);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .ugc-slider__play:hover {
    background: #fff;
    transform: translate(-50%, -50%) scale(1.05);
  }

  .ugc-slider__play svg {
    width: 20px;
    height: 20px;
  }

  .ugc-slider__nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    gap: 16px;
  }

  .ugc-slider__dots {
    display: flex;
    gap: 6px;
  }

  .ugc-slider__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.2);
    padding: 0;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .ugc-slider__dot.is-active {
    background: var(--ugc-accent);
    transform: scale(1.2);
  }

  .ugc-slider__arrows {
    display: flex;
    gap: 8px;
  }

  .ugc-slider__arrow {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }

  .ugc-slider__arrow:not(:disabled):hover {
    background: var(--ugc-accent);
    border-color: var(--ugc-accent);
    color: #fff;
  }

  .ugc-slider__arrow--next:not(:disabled) {
    background: var(--ugc-accent);
    border-color: var(--ugc-accent);
    color: #fff;
  }

  .ugc-slider__arrow:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @media (max-width: 768px) {
    .ugc-slider {
      --ugc-per-view: 2.2;
    }
    .ugc-slider__arrows {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .ugc-slider {
      --ugc-per-view: 1.5;
    }
  }
</style>

<script>
(function() {
  function init(root) {
    if (root.dataset.ugcInit === '1') return;
    root.dataset.ugcInit = '1';

    var track = root.querySelector('[data-ugc-track]');
    var dotsContainer = root.querySelector('[data-ugc-dots]');
    var prevBtn = root.querySelector('[data-ugc-prev]');
    var nextBtn = root.querySelector('[data-ugc-next]');
    var slides = Array.prototype.slice.call(track.querySelectorAll('.ugc-slider__slide'));

    function getStep() {
      if (!slides.length) return track.clientWidth;
      var rect = slides[0].getBoundingClientRect();
      var style = window.getComputedStyle(track);
      var gap = parseFloat(style.columnGap || style.gap) || 0;
      return rect.width + gap;
    }

    function getCurrentIndex() {
      var step = getStep();
      if (step <= 0) return 0;
      return Math.round(track.scrollLeft / step);
    }

    function getMaxIndex() {
      var step = getStep();
      if (step <= 0) return 0;
      var maxScroll = track.scrollWidth - track.clientWidth;
      return Math.max(0, Math.round(maxScroll / step));
    }

    function buildDots() {
      if (!dotsContainer) return;
      var count = getMaxIndex() + 1;
      dotsContainer.innerHTML = '';
      for (var i = 0; i < count; i++) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'ugc-slider__dot';
        dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
        (function(idx) {
          dot.addEventListener('click', function() {
            track.scrollTo({ left: idx * getStep(), behavior: 'smooth' });
          });
        })(i);
        dotsContainer.appendChild(dot);
      }
      updateState();
    }

    function updateState() {
      var idx = getCurrentIndex();
      var max = getMaxIndex();
      if (dotsContainer) {
        var dots = dotsContainer.querySelectorAll('.ugc-slider__dot');
        dots.forEach(function(d, i) {
          d.classList.toggle('is-active', i === idx);
        });
      }
      if (prevBtn) prevBtn.disabled = idx <= 0;
      if (nextBtn) nextBtn.disabled = idx >= max;
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        track.scrollBy({ left: -getStep(), behavior: 'smooth' });
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        track.scrollBy({ left: getStep(), behavior: 'smooth' });
      });
    }

    var scrollTimer;
    track.addEventListener('scroll', function() {
      if (scrollTimer) cancelAnimationFrame(scrollTimer);
      scrollTimer = requestAnimationFrame(updateState);
    });

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildDots, 150);
    });

    root.querySelectorAll('.ugc-slider__card').forEach(function(card) {
      var video = card.querySelector('video');
      var btn = card.querySelector('.ugc-slider__play');
      if (!video || !btn) return;

      var playIcon = btn.querySelector('.ugc-slider__icon-play');
      var pauseIcon = btn.querySelector('.ugc-slider__icon-pause');

      function setPlaying(isPlaying) {
        if (playIcon) playIcon.style.display = isPlaying ? 'none' : 'block';
        if (pauseIcon) pauseIcon.style.display = isPlaying ? 'block' : 'none';
        btn.setAttribute('aria-label', isPlaying ? 'Pause video' : 'Play video');
      }

      function toggle(e) {
        e.stopPropagation();
        if (video.paused) {
          root.querySelectorAll('video').forEach(function(v) {
            if (v !== video && !v.paused) v.pause();
          });
          var p = video.play();
          if (p && typeof p.catch === 'function') p.catch(function() {});
        } else {
          video.pause();
        }
      }

      btn.addEventListener('click', toggle);
      card.addEventListener('click', toggle);
      video.addEventListener('play', function() { setPlaying(true); });
      video.addEventListener('pause', function() { setPlaying(false); });
      video.addEventListener('ended', function() { setPlaying(false); });
    });

    buildDots();
  }

  function initAll() {
    document.querySelectorAll('[data-ugc-slider]').forEach(init);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }

  document.addEventListener('shopify:section:load', initAll);
})();
</script>
