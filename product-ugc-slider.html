<script>
(function(){
  function init(root){
    if(root.dataset.ugcInit==='1')return;root.dataset.ugcInit='1';
    var track=root.querySelector('[data-ugc-track]');
    var dotsContainer=root.querySelector('[data-ugc-dots]');
    var prevBtn=root.querySelector('[data-ugc-prev]');
    var nextBtn=root.querySelector('[data-ugc-next]');
    var slides=track.children;
    if(track){track.style.msOverflowStyle='none';}

    function getStep(){
      if(!slides.length)return track.clientWidth;
      var rect=slides[0].getBoundingClientRect();
      var cs=getComputedStyle(track);
      var gap=parseFloat(cs.columnGap||cs.gap)||0;
      return rect.width+gap;
    }
    function getIdx(){var s=getStep();return s>0?Math.round(track.scrollLeft/s):0;}
    function getMax(){var s=getStep();if(s<=0)return 0;return Math.max(0,Math.round((track.scrollWidth-track.clientWidth)/s));}

    function buildDots(){
      if(!dotsContainer)return;
      var n=getMax()+1;dotsContainer.innerHTML='';
      for(var i=0;i<n;i++){
        var d=document.createElement('button');
        d.type='button';
        d.setAttribute('aria-label','Slide '+(i+1));
        d.style.cssText='width:8px;height:8px;border-radius:50%;border:none;background:rgba(0,0,0,0.2);padding:0;cursor:pointer;transition:background .2s,transform .2s;';
        (function(idx){d.addEventListener('click',function(){track.scrollTo({left:idx*getStep(),behavior:'smooth'});});})(i);
        dotsContainer.appendChild(d);
      }
      update();
    }
    function update(){
      var idx=getIdx(),max=getMax();
      if(dotsContainer){
        Array.prototype.forEach.call(dotsContainer.children,function(d,i){
          var active=i===idx;
          d.style.background=active?'#8B1E2D':'rgba(0,0,0,0.2)';
          d.style.transform=active?'scale(1.2)':'scale(1)';
        });
      }
      if(prevBtn){prevBtn.disabled=idx<=0;prevBtn.style.opacity=idx<=0?'0.4':'1';}
      if(nextBtn){nextBtn.disabled=idx>=max;nextBtn.style.opacity=idx>=max?'0.4':'1';}
    }
    if(prevBtn)prevBtn.addEventListener('click',function(){track.scrollBy({left:-getStep(),behavior:'smooth'});});
    if(nextBtn)nextBtn.addEventListener('click',function(){track.scrollBy({left:getStep(),behavior:'smooth'});});
    var t;track.addEventListener('scroll',function(){if(t)cancelAnimationFrame(t);t=requestAnimationFrame(update);});
    var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(buildDots,150);});

    Array.prototype.forEach.call(root.querySelectorAll('[data-ugc-card]'),function(card){
      var v=card.querySelector('video');var b=card.querySelector('[data-ugc-play]');
      if(!v||!b)return;
      var pi=b.querySelector('[data-icon="play"]'),pa=b.querySelector('[data-icon="pause"]');
      function set(p){if(pi)pi.style.display=p?'none':'block';if(pa)pa.style.display=p?'block':'none';}
      function tog(e){e.stopPropagation();if(v.paused){Array.prototype.forEach.call(root.querySelectorAll('video'),function(o){if(o!==v&&!o.paused)o.pause();});var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});}else{v.pause();}}
      b.addEventListener('click',tog);card.addEventListener('click',tog);
      v.addEventListener('play',function(){set(true);});
      v.addEventListener('pause',function(){set(false);});
      v.addEventListener('ended',function(){set(false);});
    });

    buildDots();
  }
  function initAll(){Array.prototype.forEach.call(document.querySelectorAll('[data-ugc-slider]'),init);}
  try{if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initAll);}else{initAll();}}catch(_){}
  document.addEventListener('shopify:section:load',function(e){try{if(e&&e.target&&e.target.querySelector&&e.target.querySelector('[data-ugc-slider]'))initAll();}catch(_){}});
})();
</script>
