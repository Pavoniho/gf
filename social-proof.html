<style>
  .social-proof-container *,
  .social-proof-container *::before,
  .social-proof-container *::after {
    box-sizing: border-box;
  }

  .social-proof-container {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;          /* tout reste sur une seule ligne */
    gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    width: 100%;
    margin: 0 0 6px;
    white-space: nowrap;
  }

  /* AVATARS */
  .profile-images {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .profile-image {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 18%; /* centré sur la tête */
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
    display: block;
    flex-shrink: 0;
    background: #eee;
  }

  .profile-image + .profile-image {
    margin-left: -9px; /* chevauchement des bulles */
  }

  /* TEXT */
  .text-content {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-size: 14px;
    line-height: 1.2;
    color: #111111;
    white-space: nowrap;
  }

  .text-content .text1 strong {
    font-weight: 700;
  }

  .text-content .text1 p,
  .text-content .text2 p {
    display: none;
  }

  .text-content .checkmark {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }

  .text-content .checkmark svg {
    width: 14px;
    height: 14px;
    display: block;
  }

  .text-content .text2 {
    font-weight: 400;
  }

  /* MOBILE : on réduit pour que tout tienne sur une ligne */
  @media (max-width: 600px) {
    .social-proof-container { gap: 6px; }
    .profile-image { width: 22px; height: 22px; }
    .profile-image + .profile-image { margin-left: -8px; }
    .text-content { font-size: 12px; gap: 3px; }
    .text-content .checkmark svg { width: 12px; height: 12px; }
  }
</style>
