<style>
  .aq-trust *,
  .aq-trust *::before,
  .aq-trust *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .aq-trust {
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px 4px;
  }

  .aq-trust__row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .aq-trust__item {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1 1 0;
    justify-content: center;
    min-width: 0;
  }

  .aq-trust__icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    color: #4f938e; /* teal outline */
  }

  .aq-trust__icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .aq-trust__label {
    font-size: 17px;
    font-weight: 500;
    color: #2b2b2b;
    line-height: 1.25;
  }

  /* Mobile-first: 90% of visitors are on mobile */
  @media (max-width: 480px) {
    .aq-trust {
      padding: 16px 4px;
    }
    .aq-trust__row {
      gap: 10px;
    }
    .aq-trust__item {
      gap: 9px;
    }
    .aq-trust__icon {
      width: 32px;
      height: 32px;
    }
    .aq-trust__label {
      font-size: 14px;
    }
  }
</style>

<div class="aq-trust">
  <div class="aq-trust__row">

    <!-- Express Shipping -->
    <div class="aq-trust__item">
      <span class="aq-trust__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" stroke="currentColor" stroke-width="1.6"/>
          <path d="M34 15L13 22.2L21.4 26L26.4 33L34 15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M21.4 26L26.4 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 28L13 28" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M11 32L16 32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="aq-trust__label">Express Shipping</span>
    </div>

    <!-- 30-Day Guarantee -->
    <div class="aq-trust__item">
      <span class="aq-trust__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" stroke="currentColor" stroke-width="1.6"/>
          <rect x="13" y="15" width="22" height="20" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M13 21H35" stroke="currentColor" stroke-width="1.8"/>
          <path d="M18 13V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M30 13V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <text x="24" y="31.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="currentColor">30</text>
        </svg>
      </span>
      <span class="aq-trust__label">30-Day-Guarantee</span>
    </div>

  </div>
</div>
