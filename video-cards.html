  <div class="vc-row">

    <div class="vc-card" data-video="https://cdn.shopify.com/videos/c/o/v/b1ff84a3bca648adbf38f06de38020ca.mp4">
      <video src="https://cdn.shopify.com/videos/c/o/v/8a6a16f4d1e94925991d7eafba24132b.mp4" autoplay loop muted playsinline></video>
      <h3>Level Up</h3>
    </div>

    <div class="vc-card" data-video="https://cdn.shopify.com/videos/c/o/v/49c0c52f21b54060b1741176ab4634e1.mp4">
      <video src="https://cdn.shopify.com/videos/c/o/v/751b5138567649cfb9b3fb5f698fe8b5.mp4" autoplay loop muted playsinline></video>
      <h3>In Action</h3>
    </div>

    <div class="vc-card" data-video="https://cdn.shopify.com/videos/c/o/v/df8225d3d8f84b97b96f192f812e3fd4.mp4">
      <video src="https://cdn.shopify.com/videos/c/o/v/bb9757da0be4469b9a7d436a758225e9.mp4" autoplay loop muted playsinline></video>
      <h3>Fix It</h3>
    </div>

  </div>
</div>

<div class="vc-modal" id="vc-modal" aria-hidden="true">
  <button class="vc-close" id="vc-close" aria-label="Fermer">&times;</button>
  <video class="vc-modal-video" id="vc-modal-video" loop muted playsinline></video>
</div>

<style>
  .vc-section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .vc-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  .vc-card {
    width: 30%;
    cursor: pointer;
  }

  .vc-card video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }

  .vc-card h3 {
    font-size: 18px;
    text-align: left;
    margin-top: 6px;
  }

  /* ---- Modal (lightbox) ---- */
  .vc-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .vc-modal.open {
    display: flex;
  }

  .vc-modal-video {
    width: auto;
    height: auto;
    max-width: min(420px, 90vw);
    max-height: 85vh;
    max-height: 85dvh;
    object-fit: contain;
    background: #000;
    border-radius: 14px;
    box-shadow: 0 12px 45px rgba(0, 0, 0, 0.55);
  }

  .vc-close {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    font-size: 28px;
    line-height: 44px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }

  body.vc-no-scroll {
    overflow: hidden;
  }

  @media (max-width: 767px) {
    .vc-section {
      padding: 0 12px;
    }

    .vc-card h3 {
      font-size: 12px;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var modal = document.getElementById('vc-modal');
    var modalVideo = document.getElementById('vc-modal-video');
    var closeBtn = document.getElementById('vc-close');
    var cards = document.querySelectorAll('.vc-card');

    function openModal(url) {
      modalVideo.src = url;
      modalVideo.muted = true;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('vc-no-scroll');
      var p = modalVideo.play();
      if (p && p.catch) p.catch(function () {});
    }

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('vc-no-scroll');
      modalVideo.pause();
      modalVideo.removeAttribute('src');
      modalVideo.load();
    }

    cards.forEach(function (card) {
      card.addEventListener('click', function () {
        openModal(card.getAttribute('data-video'));
      });
    });

    closeBtn.addEventListener('click', closeModal);

    // Click / tap on the dark backdrop closes (but not on the video itself)
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });
  });
</script>
