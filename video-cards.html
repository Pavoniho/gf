<div class="vc-section" data-vc-root>
  <div class="vc-row">

    <div class="vc-card" data-video="https://cdn.shopify.com/videos/c/o/v/b1ff84a3bca648adbf38f06de38020ca.mp4">
      <video src="https://cdn.shopify.com/videos/c/o/v/8a6a16f4d1e94925991d7eafba24132b.mp4" autoplay loop muted playsinline preload="auto"></video>
      <h3>Level Up</h3>
    </div>

    <div class="vc-card" data-video="https://cdn.shopify.com/videos/c/o/v/49c0c52f21b54060b1741176ab4634e1.mp4">
      <video src="https://cdn.shopify.com/videos/c/o/v/751b5138567649cfb9b3fb5f698fe8b5.mp4" autoplay loop muted playsinline preload="auto"></video>
      <h3>In Action</h3>
    </div>

    <div class="vc-card" data-video="https://cdn.shopify.com/videos/c/o/v/df8225d3d8f84b97b96f192f812e3fd4.mp4">
      <video src="https://cdn.shopify.com/videos/c/o/v/bb9757da0be4469b9a7d436a758225e9.mp4" autoplay loop muted playsinline preload="auto"></video>
      <h3>Fix It</h3>
    </div>

  </div>
</div>

<style>
  .vc-section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .vc-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  .vc-card {
    width: 30%;
    cursor: pointer;
  }

  .vc-card video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }

  .vc-card h3 {
    font-size: 18px;
    text-align: left;
    margin-top: 6px;
  }

  /* ---- Modal (built in JS, attached to <body>) ---- */
  .vc-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2147483647;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    padding: 24px;
    box-sizing: border-box;
  }

  .vc-modal.vc-open {
    display: flex;
  }

  .vc-modal video {
    width: auto;
    height: auto;
    max-width: min(420px, 90vw);
    max-height: 85vh;
    max-height: 85dvh;
    object-fit: contain;
    background: #000;
    border-radius: 14px;
    box-shadow: 0 12px 45px rgba(0, 0, 0, 0.55);
  }

  .vc-close {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 26px;
    line-height: 44px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }

  body.vc-no-scroll {
    overflow: hidden;
  }

  @media (max-width: 767px) {
    .vc-section {
      padding: 0 12px;
    }

    .vc-card h3 {
      font-size: 12px;
    }
  }
</style>

<script>
  (function () {
    function initVideoCards() {
      // Build ONE shared modal on <body> (so no parent can clip it).
      var modal = document.getElementById('vc-shared-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'vc-shared-modal';
        modal.className = 'vc-modal';
        modal.innerHTML =
          '<button type="button" class="vc-close" aria-label="Fermer">&times;</button>' +
          '<video class="vc-modal-video" loop muted playsinline></video>';
        document.body.appendChild(modal);

        var mVideo = modal.querySelector('.vc-modal-video');
        var mClose = modal.querySelector('.vc-close');

        window.__vcOpen = function (url) {
          mVideo.src = url;
          mVideo.muted = true;
          modal.classList.add('vc-open');
          document.body.classList.add('vc-no-scroll');
          var p = mVideo.play();
          if (p && p.catch) { p.catch(function () {}); }
        };

        window.__vcClose = function () {
          modal.classList.remove('vc-open');
          document.body.classList.remove('vc-no-scroll');
          mVideo.pause();
          mVideo.removeAttribute('src');
          mVideo.load();
        };

        mClose.addEventListener('click', window.__vcClose);
        modal.addEventListener('click', function (e) {
          if (e.target === modal) { window.__vcClose(); }
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { window.__vcClose(); }
        });
      }

      // Wire every card (guard against double-binding on re-render).
      var cards = document.querySelectorAll('.vc-card');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        if (card.getAttribute('data-vc-bound')) { continue; }
        card.setAttribute('data-vc-bound', '1');
        card.addEventListener('click', function () {
          window.__vcOpen(this.getAttribute('data-video'));
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initVideoCards);
    } else {
      initVideoCards();
    }
  })();
</script>
